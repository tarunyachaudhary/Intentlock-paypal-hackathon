services:
  - type: web
    name: intentlock-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - { key: MONGO_URI, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: MANDATE_SECRET, generateValue: true }
      - { key: CLIENT_URL, sync: false }
      - { key: PAYPAL_CLIENT_ID, sync: false }
      - { key: PAYPAL_CLIENT_SECRET, sync: false }
      - { key: PAYPAL_BASE_URL, value: https://api-m.sandbox.paypal.com }
      - { key: OPENAI_API_KEY, sync: false }
      - { key: DEMO_MODE, value: "true" }
  - type: web
    name: intentlock-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - { key: VITE_API_URL, sync: false }
      - { key: VITE_PAYPAL_CLIENT_ID, sync: false }
